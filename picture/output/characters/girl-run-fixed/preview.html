<!doctype html><meta charset="utf-8"><title>女角色四向跑步</title><style>body{background:#e9e5d7;font:20px sans-serif;padding:30px}section{display:flex;gap:30px}canvas{width:192px;height:192px;image-rendering:pixelated}p{text-align:center}</style><h1>女角色四向跑步</h1><section><div><canvas id="down" width="96" height="96"></canvas><p>down</p></div><div><canvas id="left" width="96" height="96"></canvas><p>left</p></div><div><canvas id="up" width="96" height="96"></canvas><p>up</p></div><div><canvas id="right" width="96" height="96"></canvas><p>right</p></div></section><p>蓝绿色女角色 · 96×96 · 12 fps</p><script>const im=new Image();im.src='run.png';im.onload=()=>{let n=0;setInterval(()=>{['down','left','up','right'].forEach((d,r)=>{let c=document.getElementById(d).getContext('2d');c.clearRect(0,0,96,96);c.drawImage(im,(n%4)*96,r*96,96,96,0,0,96,96)});n++},1000/12)}</script>
